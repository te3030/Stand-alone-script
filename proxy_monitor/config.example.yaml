# --------------------- 数据库配置 ---------------------
database:
  path: "monitor.db"          # SQLite 数据库文件路径，可自定义
  retention_days: 60          # 数据保留天数，超过此天数的记录将被自动清理

# --------------------- 代理配置（支持多个代理） ---------------------
proxy:
  - url: "socks5://proxy-user:proxy-password@192.168.1.100:12345"   # 代理地址，支持 socks5/http
    label: "代理1"                                   # 代理标识，用于日志和通知，不填则使用 url
    monitor_enabled: true                            # 是否启用连通性和 IP 监测（默认 true）
    download_enabled: true                           # 是否启用下载任务（默认 true）
    connectivity:                                    # 该代理的连通性检测配置（可选，未设置则使用全局 connectivity_check）
      host: "192.168.1.100"                          # 检测目标 IP（留空则自动从 url 解析）
      port: 12345                                    # 检测目标端口（留空则自动从 url 解析）
      interval: 60                                   # 连通性检测间隔（秒）
      timeout: 5                                     # TCP 连接超时（秒）
  - url: "socks5://@192.168.1.101:12345"     # 第二个代理示例
    label: "代理2"
    monitor_enabled: false                           # 不进行监测，但可以启用下载
    download_enabled: true

# --------------------- 全局连通性默认配置（当代理未单独设置时生效） ---------------------
connectivity_check:
  interval: 60           # 默认连通性检测间隔（秒）
  timeout: 5             # 默认 TCP 连接超时（秒）

# --------------------- 下载任务配置（所有代理共用同一套 URL） ---------------------
download:
  urls:                                           # 下载文件列表，按顺序尝试，直到成功或遇到代理错误
    - "https://mirrors.aliyun.com/gradle/gradle-2.3-rc-4-bin.zip"
    - "https://res.126.net/dl/client/androidmail/dashi/webtopctest11/mail.apk"
  interval: 300                                   # 下载成功时的等待间隔（秒）
  timeout: 600                                    # 单次下载超时时间（秒）
  fail_interval_min: 10                           # 连续下载失败时，间隔将减半，但最低不会低于此值（秒）

# --------------------- IP 检测配置（代理和直连共用，按顺序尝试） ---------------------
ip_check:
  urls:
    - url: "https://myip.ipip.net/json"            # 检测 API
      ip_json_path: "ip"                           # 从返回 JSON 中提取 IP 的路径（点分隔）
      city_json_path: ""                           # 从返回 JSON 中提取域名的路径（可选，留空则不提取）
    - url: "https://api.ip2location.io"            # 备用 API
      ip_json_path: "ip"                           # 从返回 JSON 中提取 IP 的路径（点分隔）
      city_json_path: "city_name"                  # 提取城市信息的字段路径，如 "city"（可选，留空则不提取）
  interval: 600                                    # IP 检测间隔（秒）
  timeout: 10                                      # 单次 API 请求超时（秒）

# --------------------- 告警阈值（连续失败/恢复告警） ---------------------
alerts:
  download_fail_threshold: 3        # 下载连续失败多少次后发送告警
  download_success_threshold: 2     # 异常后下载连续成功多少次后发送恢复通知
  connectivity_fail_threshold: 5    # 连通性连续失败多少次后发送告警
  connectivity_success_threshold: 2 # 异常后连通性连续成功多少次后发送恢复通知

# --------------------- 统计报告配置 ---------------------
statistics:
  period_hours: 24       # 统计报告覆盖最近多少小时的数据
  send_interval: 3600    # 统计报告发送间隔（秒），首次发送会延迟此时间

# --------------------- 统一钉钉 Webhook ---------------------
webhook:
  dingtalk: "https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN"   # 钉钉机器人 webhook 地址

# --------------------- 启动消息配置 ---------------------
startup_message:
  enabled: true                                     # 是否在启动时发送钉钉消息
  title: "我的代理监控"                              # 自定义服务名称前缀，会出现在通知标题和正文首行
  items:                                            # 启动消息包含的内容项，可选项如下（可任意组合）
    - proxy_list                                    # 代理列表（含主机、端口、用户名）
    - download_urls                                 # 下载文件列表
    - download_interval                             # 下载监测频率
    - direct_ip                                     # 直连 IP（以及域名，如果 API 返回）
    - proxy_outbound_ip                             # 通过代理获取的出口 IP（以及域名）
    - proxy_connectivity                            # 每个代理的 TCP 连通性检测结果
